<p-card
  class="group relative transition-all duration-300 hover:-translate-y-1"
  styleClass="overflow-hidden border border-slate-200/70 bg-white shadow-sm hover:shadow-lg rounded-2xl"
>
  <div class="p-5">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl
                 bg-indigo-50 text-indigo-600
                 group-hover:bg-indigo-600 group-hover:text-white
                 transition-colors"
        >
          <i class="pi pi-book text-base"></i>
        </div>

        <div>
          <p class="text-xs font-medium text-slate-400 uppercase tracking-wide">
            Matemáticas avanzadas
          </p>
          <h3
            class="text-base font-semibold text-slate-800
                   group-hover:text-indigo-600 transition-colors"
          >
            Cálculo Diferencial e Integral
          </h3>
        </div>
      </div>

      <span
        class="text-[10px] font-semibold uppercase tracking-wide
               px-2.5 py-1 rounded-full
               bg-indigo-50 text-indigo-600 border border-indigo-100"
      >
        Alta
      </span>
    </div>

    <!-- Meta -->
    <div class="grid grid-cols-2 gap-4 text-xs text-slate-600 mb-5">
      <div class="flex items-center gap-2">
        <i class="pi pi-calendar-plus text-slate-400"></i>
        <span>24 May, 2024</span>
      </div>

      <div class="flex items-center gap-2 truncate">k
        <i class="pi pi-map-marker text-slate-400"></i>
        <span class="truncate">Pabellón B-12</span>
      </div>
    </div>

    <!-- Action -->
    <button
      class="w-full py-2.5 text-xs font-semibold rounded-xl
             text-slate-600 bg-slate-50
             hover:bg-indigo-600 hover:text-white
             transition-colors"
    >
      Ver detalles
    </button>

  </div>
</p-card>
