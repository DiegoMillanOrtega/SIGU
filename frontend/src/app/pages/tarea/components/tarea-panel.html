<p-panel 
  class="mt-6" 
  [class]="tareaAtrasada() ? '!border-l-2 !border-l-red-600 shadow-sm' : 'shadow-xs'"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <span class="text-xl font-semibold tracking-tight text-slate-900 dark:text-slate-100 pl-2"
        [class]="esTareaCompletada() ? 'line-through' : ''"
      >
        {{ tarea().titulo }}
      </span>
    </div>
  </ng-template>

  <ng-template pTemplate="icons">
    <p-menu #menu [model]="items()" [popup]="true" />
    <p-button
      (click)="menu.toggle($event)"
      icon="pi pi-ellipsis-v"
      [outlined]="true"
      severity="secondary"
      [text]="true"
    />
  </ng-template>

  <div class="flex flex-col gap-4 p-1">
    <div class="flex flex-wrap gap-2">
      <p-tag
        [value]="tarea().materiaNombre"
        severity="secondary"
        class="uppercase text-[10px] font-bold tracking-wider"
      ></p-tag>
      <p-tag
        [value]="'Prioridad: ' + tarea().prioridad"
        [severity]="tarea().prioridad | prioridadSeverity"
        class="text-[10px] font-bold uppercase"
      ></p-tag>
    </div>

    <p class="text-base leading-relaxed text-slate-600 dark:text-slate-400 line-clamp-3 break-words">
      {{ tarea().descripcion }}
    </p>

    <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800">
      <div class="flex items-center gap-2 text-slate-500">
        <i class="pi pi-calendar text-xs"></i>
        <span class="text-sm font-medium">
          {{ tarea().fechaEntrega | formatDateCustom}}
        </span>
      </div>

      @if (tareaAtrasada()) {
        <span class="flex items-center gap-1.5 text-red-600 text-sm font-bold">
          <i class="pi pi-exclamation-circle"></i>
          Atrasada
        </span>
      }
    </div>
  </div>
</p-panel>
