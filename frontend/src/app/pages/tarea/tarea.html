<p-card styleClass="shadow-sm">
  <ng-template pTemplate="title">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <span class="text-2xl font-bold">Gestión de Tareas</span>
      <p-button
        label="Nueva Tarea"
        icon="pi pi-plus"
        severity="success"
        [outlined]="true"
        (onClick)="tareaSeleccionada.set(null); formVisible.set(true)"
      />
    </div>
  </ng-template>

  <div class="mt-6">
    @if (tareasResource.isLoading()) {
      <div class="flex justify-center p-8">
        <app-loading />
      </div>
    } @else if (tareasResource.error()) {
      <div class="flex flex-col items-center gap-4 p-8 border-2 border-dashed border-red-200 rounded-xl">
        <i class="pi pi-exclamation-circle text-red-500 text-4xl"></i>
        <p class="text-lg font-medium">No pudimos cargar tus tareas</p>
        <p-button
          label="Reintentar"
          icon="pi pi-refresh"
          styleClass="p-button-text"
          (onClick)="tareasResource.reload()"
        />
      </div>
    } @else {
      <div class="flex flex-col gap-8">
        
        <app-tarea-table
          headerTable="Pendientes"
          [tareas]="tareasResource.value() ?? []"
          (onStatusChange)="actualizarTareaEstado($event)"
          (onEditTarea)="tareaSeleccionada.set($event); formVisible.set(true)"
          (onDelete)="eliminarTarea($event)"
        />
      </div>
    }
  </div>
</p-card>

@defer (on idle; prefetch on idle) {
  <app-tarea-form
    [(visible)]="formVisible"
    [tarea]="tareaSeleccionada()"
    (onSave)="crearTarea($event)"
    (onUpdate)="actualizarTarea($event)"
  />
}

<app-loading-spinner-overlay [isLoading]="loading()" />
